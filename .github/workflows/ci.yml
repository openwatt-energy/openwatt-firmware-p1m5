name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t openwatt-firmware-p1m5 .

      - name: Compile firmware
        run: docker run --rm -v "$PWD:/workspace" openwatt-firmware-p1m5 pio run

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: p1m5-firmware
          path: |
            .pio/build/openwatt/firmware.bin
            .pio/build/openwatt/bootloader.bin
            .pio/build/openwatt/partitions.bin
