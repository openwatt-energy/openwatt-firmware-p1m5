; OpenWatt P1 Reader - PlatformIO Configuration
; Based on reverse engineering of Xenn P1 Dongle firmware
; Compatible with Belgian smart meters (DSMR P1 port)

[platformio]
default_envs = openwatt

[env]
platform = espressif32
framework = arduino

[env:openwatt]
platform = espressif32
board = m5stack-atom
framework = arduino
extra_scripts = pre:scripts/build_templates.py, scripts/rename_firmware.py
build_src_filter = +<*> -<arduino_main_stub.cpp>

; Monitor settings
monitor_speed = 115200

; Libraries
lib_deps =
  ; MQTT client
  knolleary/PubSubClient@^2.8

  ; JSON handling
  bblanchon/ArduinoJson@^7.3.0

  ; Async web server
  me-no-dev/ESPAsyncWebServer@^1.2.4
  me-no-dev/AsyncTCP@^1.1.1

  ; RGB LED support (M5Stack Atom SK6812/WS2812)
  fastled/FastLED@^3.9.4

; Build flags
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_RUNNING_CORE=1

; Partition scheme (need room for web UI)
board_build.partitions = default.csv

; Upload settings
upload_speed = 115200

; Test environment for unit testing
[env:test]
platform = espressif32
board = m5stack-atom
framework = arduino
test_framework = unity
test_build_src = yes
test_filter = *
lib_deps =
  bblanchon/ArduinoJson@^7.3.0
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DENABLE_P1_READER=1
  -DENABLE_MQTT=1
  -DENABLE_OTA=0
  -I$PROJECT_SRC_DIR/src
  -DTEST_BUILD
  -DUNIT_TEST
build_src_filter =
  +<p1_reader.cpp>
  +<mqtt_auth.cpp>
  +<debug_logger.cpp>
  +<serial_console.cpp>
  -<arduino_main_stub.cpp>
  +<test>

