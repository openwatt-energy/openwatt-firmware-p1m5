; OpenWatt P1 Reader - PlatformIO Configuration
; Based on reverse engineering of Xenn P1 Dongle firmware
; Compatible with Belgian smart meters (DSMR P1 port)

[env:m5stack-core-esp32]
platform = espressif32
board = m5stack-core-esp32
framework = arduino

; Monitor settings
monitor_speed = 115200

; Libraries
lib_deps = 
  ; MQTT client
  knolleary/PubSubClient@^2.8
  
  ; JSON handling
  bblanchon/ArduinoJson@^7.3.0
  
  ; Async web server
  me-no-dev/ESPAsyncWebServer@^1.2.4
  me-no-dev/AsyncTCP@^1.1.1
  
  ; WiFi Manager removed - using manual WiFi setup

; Build flags
build_flags = 
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_RUNNING_CORE=1
  
; Partition scheme (need room for web UI)
board_build.partitions = default.csv
