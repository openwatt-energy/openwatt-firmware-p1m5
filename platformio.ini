; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = openwatt

[env]
platform = espressif32
framework = arduino

[env:openwatt]
platform = espressif32
board = m5stack-atom
framework = arduino
extra_scripts = pre:scripts/build_templates.py
build_src_filter =
	+<*>
	-<arduino_main_stub.cpp>
monitor_speed = 115200
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.3.0
	me-no-dev/AsyncTCP@^1.1.1
	fastled/FastLED@3.9.4
	me-no-dev/ESPAsyncWebServer@^1.2.4
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_RUNNING_CORE=1
board_build.partitions = partitions_openwatt_ota.csv
upload_speed = 115200

[env:test]
platform = espressif32
board = m5stack-atom
framework = arduino
test_framework = unity
test_build_src = yes
test_filter = *
lib_deps =
	bblanchon/ArduinoJson@^7.3.0
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DENABLE_P1_READER=1
	-DENABLE_MQTT=1
	-DENABLE_OTA=0
	-I$PROJECT_SRC_DIR/src
	-DTEST_BUILD
	-DUNIT_TEST
build_src_filter =
	+<p1_reader.cpp>
	+<mqtt_auth.cpp>
	+<debug_logger.cpp>
	+<serial_console.cpp>
	-<arduino_main_stub.cpp>
	+<test>

[env:soliseco]
platform = espressif32
board = m5stack-atom
framework = arduino
extra_scripts =
	pre:scripts/build_templates.py
	scripts/build_variant.py
build_src_filter =
	+<*>
	-<arduino_main_stub.cpp>
monitor_speed = 115200
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.3.0
	me-no-dev/ESPAsyncWebServer@^1.2.4
	me-no-dev/AsyncTCP@^1.1.1
	fastled/FastLED@3.9.4
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_RUNNING_CORE=1
	-DCUSTOMER_CONFIG_H
	-DCUSTOMER_ID=soliseco
board_build.partitions = default.csv
upload_speed = 115200

[env:creos]
platform = espressif32
board = m5stack-atom
framework = arduino
extra_scripts =
	pre:scripts/build_templates.py,
	scripts/build_variant.py
build_src_filter =
	+<*>
	-<arduino_main_stub.cpp>
monitor_speed = 115200
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.3.0
	me-no-dev/ESPAsyncWebServer@^1.2.4
	me-no-dev/AsyncTCP@^1.1.1
	fastled/FastLED@3.9.4
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_RUNNING_CORE=1
	-DCUSTOMER_CONFIG_H
	-DCUSTOMER_ID=creos
board_build.partitions = default.csv
upload_speed = 115200

[env:soliseco-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
extra_scripts =
	pre:scripts/build_templates.py
	scripts/build_variant.py
build_src_filter =
	+<*>
	-<arduino_main_stub.cpp>
monitor_speed = 115200
monitor_port = COM3
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.3.0
	me-no-dev/ESPAsyncWebServer@^1.2.4
	me-no-dev/AsyncTCP@^1.1.1
	fastled/FastLED@3.9.4
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DCUSTOMER_CONFIG_H
	-DCUSTOMER_ID=soliseco
	-DHW_SOLISECO_C3
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DSOLISECO_STAGING_TEST=0
board_build.partitions = partitions_openwatt_ota.csv
upload_speed = 115200
upload_port = COM3

[env:native]
platform = native
framework =
test_framework = unity
test_filter = test_p1
test_build_src = yes
build_flags =
	-DTEST_BUILD
	-DUNIT_TEST
build_src_filter =
	+<p1_parser.cpp>
test_ignore = test_main.cpp, test_mqtt_auth.cpp, test_p1_parser.cpp

[env:native-linky]
platform = native
framework =
test_framework = unity
test_filter = test_linky
test_build_src = yes
build_flags =
	-DTEST_BUILD
	-DUNIT_TEST
build_src_filter =
	+<linky_parser.cpp>
test_ignore = test_main.cpp, test_mqtt_auth.cpp, test_p1_parser.cpp