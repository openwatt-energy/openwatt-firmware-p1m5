<!DOCTYPE html><html lang=en>
<head>
    <meta charset=UTF-8>
    <meta name=viewport content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Settings - {{CUSTOMER_NAME}}</title>
    {{THEME_CSS}}
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4"><div class="flex justify-between h-16">
            <div class="flex items-center gap-3"><div class="text-blue-600">{{LOGO}}</div></div>
            <div class="flex items-center gap-1">
                <a href=/ class="px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">Dashboard</a>
                <a href=/settings class="px-3 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-700">Settings</a>
                <a href=/system class="px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">System</a>
            </div>
        </div></div>
    </nav>
    <main class="max-w-3xl mx-auto px-4 py-6">
        <div class="mb-6"><h1 class="text-2xl font-bold text-gray-900">Settings</h1>
        <p class="mt-1 text-sm text-gray-500" id=settingsVersion>Loading...</p></div>
        <div id=message></div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">WiFi Configuration</h2>
            <form id=wifiForm class="space-y-4">
                <div>
                    <button type=button onclick=scanWiFi() class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">Scan Networks</button>
                    <div id=wifiList class="mt-3 space-y-1"></div>
                </div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">SSID</label>
                <input type=text id=wifiSSID required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="wifiPassword" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 pr-10">
                    <button type="button" onclick="toggleVisibility('wifiPassword', 'wifiEye')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                        <svg id="wifiEye" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                    </button>
                </div></div>
                <button type=submit class="w-full sm:w-auto px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">Save WiFi Settings</button>
            </form>
        </div>
        <div class="mt-4"><button type=button onclick="fetch('/api/system/clear-wifi',{method:'PATCH'}).then(()=>{alert('WiFi cleared! Refresh page.');window.location.reload();}).catch(e=>alert('Error: '+e))" class="px-4 py-2 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 text-sm font-medium">Clear WiFi & Stop Reconnecting</button></div>

        <!-- Advanced Settings (Creos) -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6 mt-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">Advanced Settings</h2>
            <div class="mb-4">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="toggleCreos" onchange="toggleCreosForm()" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                    <span class="text-sm font-medium text-gray-700">Luxembourg (Creos) Smart Meter</span>
                </label>
            </div>
            <form id="creosForm" style="display: none;" class="space-y-4 pt-4 border-t border-gray-100">
                <p class="text-sm text-gray-500 mb-2">Creos meters require a 32-character hexadecimal decryption key to read data.</p>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Meter Decryption Key (Hex)</label>
                    <div class="relative">
                        <input type="password" id="creosKey" minlength="32" maxlength="32" placeholder="0123456789ABCDEF0123456789ABCDEF" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 font-mono text-sm uppercase pr-10">
                        <button type="button" onclick="toggleVisibility('creosKey', 'creosEye')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                            <svg id="creosEye" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full sm:w-auto px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">Save Decryption Key</button>
            </form>
        </div>

        #if MQTT_SETTINGS_UI_ENABLED
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">MQTT Configuration</h2>
            <form id=mqttForm class="space-y-4">
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Broker Host</label>
                <input type=text id=mqttHost class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Port</label>
                <input type=number id=mqttPort value=1883 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Topic</label>
                <input type=text id=mqttTopic class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></div>
                <button type=submit class="w-full sm:w-auto px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">Save MQTT Settings</button>
            </form>
        </div>
        #endif
    </main>
    <footer class="mt-8 pb-6 text-center text-xs text-gray-400">
        <a href="https://openwatt.eu" target="_blank" rel="noopener noreferrer" class="hover:text-gray-600 transition-colors">OpenWatt</a>
    </footer>
    <script>
        function toggleVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
            }
        }
        function escapeHtml(t){return t?t.replace(/"/g,'&quot;').replace(/'/g,'&#039;'):'';}
        function toggleCreosForm() {
            const isEnabled = document.getElementById('toggleCreos').checked;
            document.getElementById('creosForm').style.display = isEnabled ? 'block' : 'none';
        }

        fetch('/api/system').then(r=>r.json()).then(d=>{document.getElementById('settingsVersion').textContent='FW '+d.firmware_version;});

        fetch('/api/config').then(r=>r.json()).then(data=>{
            if(data.wifi&&data.wifi.ssid) document.getElementById('wifiSSID').value=data.wifi.ssid;
            #if MQTT_SETTINGS_UI_ENABLED
            if(data.mqtt){document.getElementById('mqttHost').value=data.mqtt.host||'';document.getElementById('mqttPort').value=data.mqtt.port||1883;document.getElementById('mqttTopic').value=data.mqtt.topic||'';}
            #endif
            // Load Creos Key if exists
            if(data.creos_key && data.creos_key.length > 0) {
                document.getElementById('toggleCreos').checked = true;
                document.getElementById('creosKey').value = data.creos_key;
                toggleCreosForm();
            }
        });

        function scanWiFi(){const list=document.getElementById('wifiList');list.innerHTML='<div class="text-sm text-gray-500">Scanning...</div>';fetch('/api/wifiscan').then(r=>r.json()).then(data=>{if(data.error){list.innerHTML='<div class="text-sm text-red-600">'+data.error+'</div>';return;}const nets=data.networks||[];if(nets.length===0){list.innerHTML='<div class="text-sm text-gray-500">No networks found</div>';return;}const selectHTML = "<select class=\"w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm mt-2\" onchange=\"document.getElementById('wifiSSID').value=this.value;\">" + "<option value=\"\" disabled selected>Select a scanned network...</option>" + nets.map(n => "<option value=\""+escapeHtml(n.ssid||'').replace(/\"/g, '&quot;')+"\">"+escapeHtml(n.ssid||'').replace(/\"/g, '&quot;')+" ("+(n.rssi||0)+" dBm)</option>").join('') + "</select>"; list.innerHTML=selectHTML;}).catch(()=>{list.innerHTML='<div class="text-sm text-red-600">Scan failed</div>';});}

        document.getElementById('wifiForm').addEventListener('submit',(e)=>{e.preventDefault();const pwd=document.getElementById('wifiPassword').value;if(pwd.trim()===''){if(!confirm('You have left the password empty. Is it intentional to save an empty password for an open network?'))return;}fetch('/api/config/wifi',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({wifi:{ssid:document.getElementById('wifiSSID').value,password:pwd}})}).then(()=>{document.getElementById('message').innerHTML='<div class="mb-4 p-4 bg-emerald-50 text-emerald-700 rounded-lg">WiFi saved! Restarting...</div>';setTimeout(()=>window.location.href='/',2000);});});

        document.getElementById('creosForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const key = document.getElementById('creosKey').value.toUpperCase();
            fetch('/api/config/creos_key', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ creos_key: key })
            }).then(r => {
                if(r.ok) {
                    document.getElementById('message').innerHTML = '<div class="mb-4 p-4 bg-emerald-50 text-emerald-700 rounded-lg">Decryption key saved!</div>';
                } else {
                    document.getElementById('message').innerHTML = '<div class="mb-4 p-4 bg-red-50 text-red-700 rounded-lg">Error saving key.</div>';
                }
            });
        });

        #if MQTT_SETTINGS_UI_ENABLED
        document.getElementById('mqttForm').addEventListener('submit',(e)=>{e.preventDefault();fetch('/api/config/mqtt',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({mqtt:{host:document.getElementById('mqttHost').value,port:parseInt(document.getElementById('mqttPort').value),topic:document.getElementById('mqttTopic').value}})}).then(()=>{document.getElementById('message').innerHTML='<div class="mb-4 p-4 bg-emerald-50 text-emerald-700 rounded-lg">MQTT settings saved!</div>';});});
        #endif
    </script>
</body>
</html>
