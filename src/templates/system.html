<!DOCTYPE html><html lang=en>
<head>
    <meta charset=UTF-8>
    <meta name=viewport content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>System - {{CUSTOMER_NAME}}</title>
    {{THEME_CSS}}
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4"><div class="flex justify-between h-16">
            <div class="flex items-center gap-3"><div class="text-blue-600">{{LOGO}}</div></div>
            <div class="flex items-center gap-1">
                <a href=/ class="px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">Dashboard</a>
                <a href=/settings class="px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">Settings</a>
                <a href=/system class="px-3 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-700">System</a>
            </div>
        </div></div>
    </nav>
    <main class="max-w-3xl mx-auto px-4 py-6">
        <div class="mb-6"><h1 class="text-2xl font-bold text-gray-900">System</h1>
        <p class="mt-1 text-sm text-gray-500" id=systemVersion>Loading...</p></div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">System Information</h2>
            <div id=systemInfo class="space-y-3"><div class="flex justify-between py-2"><span class="text-gray-600">Loading...</span></div></div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">System Actions</h2>
            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick=reboot() class="inline-flex items-center justify-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">Reboot Device</button>
                <button onclick=factoryReset() class="inline-flex items-center justify-center px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-sm font-medium">Factory Reset</button>
            </div>
        </div>
    </main>
    <footer class="mt-8 pb-6 text-center text-xs text-gray-400">
        <a href="https://openwatt.eu" target="_blank" rel="noopener noreferrer" class="hover:text-gray-600 transition-colors">OpenWatt</a>
    </footer>
    <script>
        fetch('/api/system').then(r=>r.json()).then(data=>{
            document.getElementById('systemVersion').textContent='FW '+data.firmware_version;
            document.getElementById('systemInfo').innerHTML='<div class="flex justify-between py-2 border-b border-gray-100"><span class="text-gray-600">Firmware</span><span class="font-medium">'+data.firmware_version+'</span></div><div class="flex justify-between py-2 border-b border-gray-100"><span class="text-gray-600">Customer</span><span class="font-medium">'+data.display_name+'</span></div><div class="flex justify-between py-2 border-b border-gray-100"><span class="text-gray-600">Fingerprint</span><span class="font-medium">'+data.fingerprint+'</span></div><div class="flex justify-between py-2 border-b border-gray-100"><span class="text-gray-600">Device ID</span><span class="font-medium">'+data.device_id+'</span></div><div class="flex justify-between py-2 border-b border-gray-100"><span class="text-gray-600">Serial</span><span class="font-medium">'+data.serial_number+'</span></div><div class="flex justify-between py-2"><span class="text-gray-600">API URL</span><a href='+window.location.origin+'/api/system class="text-blue-600 hover:underline font-medium">'+window.location.origin+'</a></div>';
        });
        function reboot(){if(confirm('Reboot device?'))fetch('/api/system/reboot',{method:'PATCH'});}
        function factoryReset(){if(confirm('WARNING: This will erase all settings!'))fetch('/api/system/factory_reset',{method:'PATCH'});}
    </script>
</body>
</html>
