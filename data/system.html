<!DOCTYPE html><html lang=en>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>System - OpenWatt</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
    .max-w-7xl{max-width:80rem;margin:0 auto;padding:0 1rem}
    .max-w-3xl{max-width:48rem;margin:0 auto;padding:0 1rem}
    .mx-auto{margin-left:auto;margin-right:auto}
    .px-4{padding-left:1rem;padding-right:1rem}
    .py-6{padding-top:1.5rem;padding-bottom:1.5rem}
    .p-4{padding:1rem}
    .p-5{padding:1.25rem}
    .p-6{padding:1.5rem}
    .mb-4{margin-bottom:1rem}
    .mb-6{margin-bottom:1.5rem}
    .mt-1{margin-top:.25rem}
    .mt-3{margin-top:.75rem}
    .space-y-1>*+*{margin-top:.25rem}
    .space-y-3>*+*{margin-top:.75rem}
    .space-y-4>*+*{margin-top:1rem}
    .gap-1{gap:.25rem}
    .gap-3{gap:.75rem}
    .gap-4{gap:1rem}
    .flex{display:flex}
    .flex-col{flex-direction:column}
    .items-center{align-items:center}
    .justify-between{justify-content:space-between}
    .justify-center{justify-content:center}
    .grid{display:grid}
    .grid-cols-1{grid-template-columns:repeat(1,minmax(0,1fr))}
    .h-10{height:2.5rem}
    .h-16{height:4rem}
    .w-10{width:2.5rem}
    .h-2\\.5{height:.625rem}
    .w-2\\.5{width:.625rem}
    .rounded{border-radius:.25rem}
    .rounded-lg{border-radius:.5rem}
    .rounded-xl{border-radius:.75rem}
    .rounded-full{border-radius:9999px}
    @media(min-width:640px){.sm\\:flex-row{flex-direction:row}
    .sm\\:grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .sm\\:w-auto{width:auto}
    }
    @media(min-width:1024px){.lg\\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .lg\\:grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    }
    .bg-white{background:#fff}
    .bg-gray-50{background:#f9fafb}
    .bg-gray-100{background:#f3f4f6}
    .bg-gray-900{background:#111827}
    .bg-blue-50{background:#eff6ff}
    .bg-blue-600{background:#2563eb}
    .bg-emerald-50{background:#ecfdf5}
    .bg-emerald-100{background:#d1fae5}
    .bg-red-50{background:#fef2f2}
    .bg-red-100{background:#fee2e2}
    .bg-red-500{background:#ef4444}
    .bg-red-600{background:#dc2626}
    .bg-purple-50{background:#faf5ff}
    .bg-orange-50{background:#fff7ed}
    .bg-gradient-to-br{background:linear-gradient(to bottom right,var(--tw-gradient-stops))}
    .from-blue-50{--tw-gradient-from:#eff6ff;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to,rgb(239 246 255 / 0))}
    .to-blue-100{--tw-gradient-to:#dbeafe}
    .from-green-50{--tw-gradient-from:#f0fdf4;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to,rgb(240 253 244 / 0))}
    .to-green-100{--tw-gradient-to:#dcfce7}
    .from-purple-50{--tw-gradient-from:#faf5ff;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to,rgb(250 245 255 / 0))}
    .to-purple-100{--tw-gradient-to:#f3e8ff}
    .from-orange-50{--tw-gradient-from:#fff7ed;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to,rgb(255 247 237 / 0))}
    .to-orange-100{--tw-gradient-to:#ffedd5}
    .text-white{color:#fff}
    .text-gray-400{color:#9ca3af}
    .text-gray-500{color:#6b7280}
    .text-gray-600{color:#4b5563}
    .text-gray-700{color:#374151}
    .text-gray-900{color:#111827}
    .text-blue-400{color:#60a5fa}
    .text-blue-600{color:#2563eb}
    .text-blue-700{color:#1d4ed8}
    .text-blue-900{color:#1e3a8a}
    .text-emerald-400{color:#34d399}
    .text-emerald-600{color:#059669}
    .text-emerald-700{color:#047857}
    .text-emerald-800{color:#065f46}
    .text-red-400{color:#f87171}
    .text-red-500{color:#ef4444}
    .text-red-600{color:#dc2626}
    .text-red-700{color:#b91c1c}
    .text-red-800{color:#991b1b}
    .text-purple-400{color:#c084fc}
    .text-purple-600{color:#9333ea}
    .text-purple-900{color:#581c87}
    .text-green-400{color:#4ade80}
    .text-green-600{color:#16a34a}
    .text-green-900{color:#14532d}
    .text-orange-400{color:#fb923c}
    .text-orange-600{color:#ea580c}
    .text-orange-900{color:#7c2d12}
    .text-yellow-400{color:#facc15}
    .text-yellow-600{color:#ca8a04}
    .text-pink-400{color:#f472b6}
    .text-pink-600{color:#db2777}
    .text-cyan-400{color:#22d3ee}
    .text-teal-400{color:#2dd4bf}
    .text-amber-400{color:#fbbf24}
    .text-blue-500{color:#3b82f6}
    .text-emerald-500{color:#10b981}
    .font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    .font-medium{font-weight:500}
    .font-semibold{font-weight:600}
    .font-bold{font-weight:700}
    .text-xs{font-size:.75rem}
    .text-sm{font-size:.875rem}
    .text-lg{font-size:1.125rem}
    .text-2xl{font-size:1.5rem}
    .text-center{text-align:center}
    .border{border-width:1px;border-style:solid}
    .border-b{border-bottom-width:1px}
    .border-gray-100{border-color:#f3f4f6}
    .border-gray-200{border-color:#e5e7eb}
    .border-gray-300{border-color:#d1d5db}
    .border-gray-700{border-color:#374151}
    .border-gray-800{border-color:#1f2937}
    .border-blue-200{border-color:#bfdbfe}
    .border-green-200{border-color:#bbf7d0}
    .border-purple-200{border-color:#e9d5ff}
    .border-orange-200{border-color:#fed7aa}
    .shadow-sm{box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}
    .shadow-lg{box-shadow:0 10px 15px -3px rgb(0 0 0 / .1)}
    .sticky{position:sticky}
    .top-0{top:0}
    .z-50{z-index:50}
    .overflow-hidden{overflow:hidden}
    .cursor-pointer{cursor:pointer}
    .hover\\:bg-gray-50:hover{background:#f9fafb}
    .hover\\:bg-blue-100:hover{background:#dbeafe}
    .hover\\:bg-blue-700:hover{background:#1d4ed8}
    .hover\\:bg-red-700:hover{background:#b91c1c}
    .hover\\:underline:hover{text-decoration:underline}
    .transition{transition-property:all;transition-timing-function:cubic-bezier(.4,0,.2,1);transition-duration:.15s}
    input[type=text],input[type=password],input[type=number]{width:100%;padding:.5rem .75rem;border:1px solid #d1d5db;border-radius:.5rem;font-size:.875rem}
    input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
    label{display:block;font-size:.875rem;font-weight:500;color:#374151;margin-bottom:.25rem}
    button{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.5rem 1rem;border-radius:.5rem;font-size:.875rem;font-weight:500;cursor:pointer;border:none;transition:all .15s}
    button:hover{opacity:.9}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-danger{background:#dc2626;color:#fff}
    .inline-flex{display:inline-flex}
    .gap-2{gap:.5rem}
    .ml-2{margin-left:.5rem}
    .ml-auto{margin-left:auto}
    .px-2\\.5{padding-left:.625rem;padding-right:.625rem}
    .py-0\\.5{padding-top:.125rem;padding-bottom:.125rem}
    .py-1{padding-top:.25rem;padding-bottom:.25rem}
    .py-2{padding-top:.5rem;padding-bottom:.5rem}
    .px-3{padding-left:.75rem;padding-right:.75rem}
    .py-2{padding-top:.5rem;padding-bottom:.5rem}
    .pb-3{padding-bottom:.75rem}
    .inline-block{display:inline-block}
    .w-full{width:100%}
    .hidden{display:none}
    .alert{padding:1rem;border-radius:.5rem;margin-bottom:1rem}
    .alert-success{background:#ecfdf5;color:#065f46}
    .alert-error{background:#fef2f2;color:#991b1b}
    .alert-info{background:#eff6ff;color:#1e40af}
    .offline-mode{background:#fef3c7;border:1px solid #f59e0b;padding:0.75rem;border-radius:0.5rem;margin-bottom:1rem;color:#92400e}
  </style>
</head>
<body>

  <nav class="bg-white border-b border-gray-200 sticky top-0 z-50"><div class="max-w-7xl mx-auto px-4"><div class="flex justify-between h-16"><div class="flex items-center gap-3"><div class=text-blue-600><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="h-10 w-10"><defs><linearGradient id="owGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:var(--primary);stop-opacity:1" /><stop offset="100%" style="stop-color:var(--accent);stop-opacity:1" /></linearGradient></defs><circle cx="24" cy="24" r="22" fill="url(#owGrad)" /><path fill="white" d="M28 12l-12 16h8l-4 16 16-20h-8l4-12z" /></svg></div></div><div class="flex items-center gap-1"><a href=/ class="px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">Dashboard</a><a href=/settings class="px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">Settings</a><a href=/system class="px-3 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-700">System</a></div></div></div>
  </nav>
  <main class="max-w-3xl mx-auto px-4 py-6"><div class=mb-6><h1 class="text-2xl font-bold text-gray-900">System</h1><p class="mt-1 text-sm text-gray-500" id=systemVersion>Loading...</p></div><div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6"><h2 class="text-lg font-semibold text-gray-900 mb-4">System Information</h2><div id=systemInfo class=space-y-3><div class="flex justify-between py-2"><span class=text-gray-600>Loading...</span></div></div></div><div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6"><h2 class="text-lg font-semibold text-gray-900 mb-4">System Actions</h2><div class="flex flex-col sm:flex-row gap-3"><button onclick=reboot() class="inline-flex items-center justify-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">Reboot Device</button><button onclick=factoryReset() class="inline-flex items-center justify-center px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-sm font-medium">Factory Reset</button></div></div>
  </main>
  <script>fetch('/api/system').then(r=>r.json()).then(data=>{document.getElementById('systemVersion').textContent='FW '+data.firmware_version;document.getElementById('systemInfo').innerHTML='<div class="flex justify-between py-2 border-b border-gray-100"><span class=text-gray-600>Firmware</span><span class=font-medium>'+data.firmware_version+'</span></div><div class="flex justify-between py-2 border-b border-gray-100"><span class=text-gray-600>Customer</span><span class=font-medium>'+data.display_name+'</span></div><div class="flex justify-between py-2 border-b border-gray-100"><span class=text-gray-600>Fingerprint</span><span class=font-medium>'+data.fingerprint+'</span></div><div class="flex justify-between py-2 border-b border-gray-100"><span class=text-gray-600>Device ID</span><span class=font-medium>'+data.device_id+'</span></div><div class="flex justify-between py-2 border-b border-gray-100"><span class=text-gray-600>Serial</span><span class=font-medium>'+data.serial_number+'</span></div><div class="flex justify-between py-2"><span class=text-gray-600>API URL</span><a href='+window.location.origin+'/api/system class=text-blue-600 hover:underline font-medium>'+window.location.origin+'</a></div>';});function reboot(){if(confirm('Reboot device?'))fetch('/api/system/reboot',{method:'PATCH'});}function factoryReset(){if(confirm('WARNING: This will erase all settings!'))fetch('/api/system/factory_reset',{method:'PATCH'});}
  </script>
</body>
</html>
