    input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}

    .px-2\\.5{padding-left:.625rem;padding-right:.625rem}

<body>

  <nav class="bg-white border-b border-gray-200 sticky top-0 z-50"><div class="max-w-7xl mx-auto px-4"><div class="flex justify-between h-16"><div class="flex items-center gap-3"><div class=text-blue-600><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="h-10 w-10"><defs><linearGradient id="owGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:var(--primary);stop-opacity:1" /><stop offset="100%" style="stop-color:var(--accent);stop-opacity:1" /></linearGradient></defs><circle cx="24" cy="24" r="22" fill="url(#owGrad)" /><path fill="white" d="M28 12l-12 16h8l-4 16 16-20h-8l4-12z" /></svg></div></div><div class="flex items-center gap-1"><a href=/ class="px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">Dashboard</a><a href=/settings class="px-3 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-700">Settings</a><a href=/system class="px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">System</a></div></div></div>
  </nav>
  <main class="max-w-3xl mx-auto px-4 py-6"><div class=mb-6><h1 class="text-2xl font-bold text-gray-900">Settings</h1><p class="mt-1 text-sm text-gray-500" id=settingsVersion>Loading...</p></div><div id=message></div><div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6"><h2 class="text-lg font-semibold text-gray-900 mb-4">WiFi Configuration</h2><form id=wifiForm class=space-y-4><div><button type=button onclick=scanWiFi() class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">Scan Networks</button><div id=wifiList class="mt-3 space-y-1"></div></div><div><label class="block text-sm font-medium text-gray-700 mb-1">SSID</label><input type=text id=wifiSSID required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></div><div><label class="block text-sm font-medium text-gray-700 mb-1">Password</label><input type=password id=wifiPassword class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></div><button type=submit class="w-full sm:w-auto px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">Save WiFi Settings</button></form></div><div class="mt-4"><button type=button onclick="fetch('/api/system/clear-wifi',{method:'PATCH'}).then(()=>{alert('WiFi cleared! Refresh page.');window.location.reload();}).catch(e=>alert('Error: '+e))" class="px-4 py-2 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 text-sm font-medium">Clear WiFi & Stop Reconnecting</button></div><div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6"><h2 class="text-lg font-semibold text-gray-900 mb-4">MQTT Configuration</h2><form id=mqttForm class=space-y-4><div><label class="block text-sm font-medium text-gray-700 mb-1">Broker Host</label><input type=text id=mqttHost class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></div><div><label class="block text-sm font-medium text-gray-700 mb-1">Port</label><input type=number id=mqttPort value=1883 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></div><div><label class="block text-sm font-medium text-gray-700 mb-1">Topic</label><input type=text id=mqttTopic class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></div><button type=submit class="w-full sm:w-auto px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">Save MQTT Settings</button></form></div>
  </main>
  <script>fetch('/api/system').then(r=>r.json()).then(d=>{document.getElementById('settingsVersion').textContent='FW '+d.firmware_version;});fetch('/api/config').then(r=>r.json()).then(data=>{if(data.wifi&&data.wifi.ssid)document.getElementById('wifiSSID').value=data.wifi.ssid;if(data.mqtt){document.getElementById('mqttHost').value=data.mqtt.host||'';document.getElementById('mqttPort').value=data.mqtt.port||1883;document.getElementById('mqttTopic').value=data.mqtt.topic||'';}});function scanWiFi(){const list=document.getElementById('wifiList');list.innerHTML='<div class=text-sm text-gray-500>Scanning...</div>';fetch('/api/wifiscan').then(r=>r.json()).then(data=>{if(data.error){list.innerHTML='<div class=text-sm text-red-600>'+data.error+'</div>';return;}const nets=data.networks||[];if(nets.length===0){list.innerHTML='<div class=text-sm text-gray-500>No networks found</div>';return;}const getSignalIcon=(r)=>{if(r>=-45)return'📶 excellent';if(r>=-60)return'📶 good';if(r>=-75)return'📶 fair';return'📶 weak';};const fmtSig=(r)=>r<-90?getSignalIcon(r):getSignalIcon(r)+' ('+r+' dBm)';list.innerHTML=nets.map(n=>'<div class="wifi-row p-2 hover:bg-gray-50 cursor-pointer rounded text-sm" data-ssid="'+(n.ssid||'')+'"><span class="font-medium">'+(n.ssid||'')+'</span><span class="text-gray-400 ml-2">'+fmtSig(n.rssi)+'</span></div>').join('');list.querySelectorAll('.wifi-row').forEach(el=>{el.onclick=()=>{document.getElementById('wifiSSID').value=el.getAttribute('data-ssid')||'';};});}).catch(()=>{list.innerHTML='<div class=text-sm text-red-600>Scan failed</div>';});}document.getElementById('wifiForm').addEventListener('submit',(e)=>{e.preventDefault();const ssid=document.getElementById('wifiSSID').value;const pwd=document.getElementById('wifiPassword').value;console.log('Saving WiFi:',ssid);fetch('/api/config/wifi',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({wifi:{ssid:ssid,password:pwd}})}).then(r=>{console.log('WiFi save response:',r.status);if(r.ok){document.getElementById('message').innerHTML='<div class="mb-4 p-4 bg-emerald-50 text-emerald-700 rounded-lg">WiFi saved! Restarting...</div>';setTimeout(()=>window.location.href='/',2000);}else{r.text().then(t=>{document.getElementById('message').innerHTML='<div class="mb-4 p-4 bg-red-50 text-red-700 rounded-lg">Error: '+t+'</div>';});}}).catch(e=>{console.error('WiFi save error:',e);document.getElementById('message').innerHTML='<div class="mb-4 p-4 bg-red-50 text-red-700 rounded-lg">Error: '+e.message+'</div>';});});document.getElementById('mqttForm').addEventListener('submit',(e)=>{e.preventDefault();fetch('/api/config/mqtt',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({mqtt:{host:document.getElementById('mqttHost').value,port:parseInt(document.getElementById('mqttPort').value),topic:document.getElementById('mqttTopic').value}})}).then(()=>{document.getElementById('message').innerHTML='<div class="mb-4 p-4 bg-emerald-50 text-emerald-700 rounded-lg">MQTT settings saved!</div>';});});
  </script>
</body>
